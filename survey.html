<!DOCTYPE html>
<html>
<head>
    <title>NetSync - New Survey</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f4f7f6; margin: 0; }
        .header { background-color: #0a0b1e; color: white; padding: 10px 50px; display: flex; align-items: center; justify-content: space-between; }
        .brand-container { display: flex; align-items: center; gap: 15px; text-decoration: none; color: white; }
        .system-logo { height: 45px; border-radius: 5px; }
        .card { background: white; padding: 40px; border-radius: 15px; width: 450px; margin: 50px auto; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
        h1 { margin-top: 0; font-size: 24px; text-align: center; }
        label { font-weight: bold; display: block; margin-bottom: 5px; color: #444; }
        input { width: 100%; padding: 12px; margin-bottom: 20px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
        button { width: 100%; padding: 15px; background: #000; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        button:hover { background: #333; }
        .back-btn { display: block; text-align: center; margin-top: 15px; color: #666; text-decoration: none; font-size: 14px; }
    </style>
</head>
<body>
    <div class="header">
        <a href="/" class="brand-container">
            <img src="{{ url_for('static', filename='uploads/icons/netsync.jpg') }}" class="system-logo">
            <div style="font-size: 24px; font-weight: bold;">NetSync</div>
        </a>
    </div>
    
    <div class="card">
        <h1>New Project Survey</h1>
        <form action="/create-project" method="POST" enctype="multipart/form-data">
            <label>Site Name</label>
            <input type="text" name="site_name" placeholder="e.g. Quezon City Hub" required>
            
            <label>Location</label>
            <input type="text" name="location" placeholder="Full Address" required>
            
            <label>Upload Initial Site Photo</label>
            <input type="file" name="site_photo" accept="image/*" required>
            
            <button type="submit">Create Project & Continue</button>
        </form>
        <a href="/" class="back-btn"><i class="fas fa-arrow-left"></i> Cancel and Return</a>
    </div>
</body>
</html>
