<!DOCTYPE html>
<html>
<head>
    <title>NetSync Login</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #0a0b1e; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 40px; border-radius: 15px; width: 350px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #5d87ff; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <div class="card">
        <h2 style="margin-top:0;">NetSync Login</h2>
        <form method="POST">
            <input type="text" name="username" placeholder="Username" required>
            <input type="password" name="password" placeholder="Password" required>
            <button type="submit">Login</button>
        </form>
        <p style="font-size:14px; margin-top:20px;">No account? <a href="/register" style="color:#5d87ff;">Register here</a></p>
    </div>
</body>
</html>
