<!DOCTYPE html>
<html>
<head>
    <title>User Profile</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f4f7f6; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 40px; border-radius: 15px; width: 350px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
    </style>
</head>
<body>
    <div class="card">
        <h2>My Profile</h2>
        <p><strong>Username:</strong> {{ current_user.username }}</p>
        <p><strong>Role:</strong> {{ current_user.role|capitalize }}</p>
        <hr>
        <a href="/" style="color: #5d87ff; text-decoration: none;">Back to Dashboard</a>
    </div>
</body>
</html>
